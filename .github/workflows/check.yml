name: Check

# The fast check on every push and pull request (round 3G item 9): about ten
# minutes on Linux, no installer. It type-checks and tests the front end and
# checks, lints and tests the Rust (the pure-Rust tests; what only runs on
# Windows is in the full build, windows-build.yml). Clippy is run for dead
# code and unused items only: they fail the check, style lints don't. The
# "Security" job checks the dependencies for advisories and the commits for
# secrets (round 3G item 8).

on:
  push:
    branches: [main, 'groovy-ai-*']
    paths:
      - 'windows/**'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # What Tauri, the speech engine's build (cmake, libclang) and the audio
      # and desktop crates link against on Linux.
      - name: System libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev patchelf \
            libwebkit2gtk-4.1-dev libgtk-layer-shell-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev libasound2-dev libxdo-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      # The speech engine's static library, fetched here once per run into the
      # runner's temp folder and handed to sherpa-onnx-sys (SHERPA_ONNX_LIB_DIR),
      # instead of its build script unpacking it into target/ — where a cached
      # target/ and the several cargo profiles of this job disagreed about
      # whether it was there ("could not find native static library").
      - name: Speech engine library
        run: |
          version=$(grep -A1 'name = "sherpa-onnx-sys"' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          name="sherpa-onnx-v${version}-linux-x64-static-lib"
          mkdir -p "$RUNNER_TEMP/sherpa"
          curl -fsSL --retry 4 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${version}/${name}.tar.bz2" | tar -xj -C "$RUNNER_TEMP/sherpa"
          ls "$RUNNER_TEMP/sherpa/$name/lib" | head -3
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/sherpa/$name/lib" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # One file per language, made from the two tables (round 3F item 6);
      # the type check imports them.
      - name: Translation files
        run: npm run gen:i18n

      - name: Type check
        run: npx tsc --noEmit

      - name: Front-end tests
        run: npm test

      # Round 3G item 3: every page opens under the release CSP (no inline
      # styles, no wildcard wss:) with a frozen Object.prototype.
      - name: Pages work under the release CSP
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          npm i --no-save playwright-core@1.48.2
          npx vite build
          node --import ./tests/setup.mjs scripts/csp-check.mjs

      # The app's build script bundles the relay (groovy-hook), so it is built first.
      - name: Build the relay
        run: cargo build --release -p groovy-hook

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo check with the CI switches (ci feature)
        run: cargo check -p groovy --all-targets --features ci

      # Dead code and unused items fail; clippy's style lints are not enforced.
      - name: cargo clippy (dead code and unused items)
        run: cargo clippy --workspace --all-targets -- -A clippy::all -D dead_code -D unused

      - name: cargo clippy with the ci feature
        run: cargo clippy -p groovy --all-targets --features ci -- -A clippy::all -D dead_code -D unused

      - name: cargo test
        run: cargo test --workspace

  # Dependencies with a known advisory, and secrets in the commits, fail the push
  # (high and critical for npm; every Rust advisory with a fix except the ones
  # justified in windows/.cargo/audit.toml).
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (secrets in the pushed commits and the history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: npm audit (shipped packages, high and critical)
        working-directory: windows
        run: npm audit --omit=dev --audit-level=high

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: windows
        run: cargo audit
