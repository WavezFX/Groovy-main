name: Windows CI

# Type-checks and tests the Windows app on every pull request that touches it.
# Nothing is packed and nothing is published: releases stay in windows.yml,
# which only runs on tags.

on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tests run the TypeScript sources directly, which needs Node 22.18
      # or newer; 24 is the version they are run with locally.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-ci-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-ci-cargo-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Island tests
        run: npm test

      # The app bundles target/release/groovy-hook.exe as a resource, and its
      # build script refuses to run until that file exists. One command per
      # step: PowerShell carries on after a failed command in the same step.
      - name: Build the relay
        run: cargo build --release -p groovy-hook

      # Failures are also printed as annotations, so they show on the run's page.
      - name: Rust tests
        shell: pwsh
        run: |
          cargo test --workspace 2>&1 | Tee-Object -FilePath rust-tests.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # One annotation holding the panics (GitHub shows at most 10 per step).
            $lines = Select-String -Path rust-tests.txt -Pattern 'panicked at|^---- |^error(\[|:)|left:|right:|assertion' |
              Select-Object -First 80 | ForEach-Object { $_.Line }
            "::error::$($lines -join '%0A')"
          }
          exit $code
