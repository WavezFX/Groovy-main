[workspace]
members = ["src-tauri", "hook"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"

# Release profile shared by the app and the hook relay: the hook must start fast
# (Claude Code spawns it on every event), so we optimise for size and speed.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# sherpa-onnx-sys 1.13.8 with its build-only zip dependency moved to zip 9
# (cargo audit); see vendor/sherpa-onnx-sys/README.md for what and when to drop.
[patch.crates-io]
sherpa-onnx-sys = { path = "vendor/sherpa-onnx-sys" }
