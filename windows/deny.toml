# Licence gate (round 3J item 1). GPL, AGPL and LGPL crates fail the build; a new
# licence is added here only after the owner has read it.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
  "MPL-2.0", "CC0-1.0", "Unlicense", "0BSD", "BSL-1.0", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
