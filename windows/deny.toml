# Licence gate (round 3J item 1). GPL, AGPL and LGPL crates fail the build; a new
# licence is added here only after the owner has read it.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
confidence-threshold = 0.9
# Round 4E item 5: MIT, BSD-2/3-Clause, ISC and Apache-2.0, plus only the
# licences already in the release build, each with the crates that need it.
allow = [
  "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0",          # icu_*, zerovec, yoke, tinystr… (Unicode data tables, via url/idna)
  "Zlib",                 # foldhash, zlib-rs (permissive, zlib licence)
  "MPL-2.0",              # symphonia (audio decoding), cssparser/selectors (via Tauri), option-ext: file-level copyleft only, unmodified
  "BSL-1.0",              # clipboard-win, error-code (Boost licence, permissive)
  "CC0-1.0",              # notify (public domain dedication)
  "CDLA-Permissive-2.0",  # webpki-roots (the Mozilla root certificate list as data)
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
