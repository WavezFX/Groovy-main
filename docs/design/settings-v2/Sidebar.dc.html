<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Groovy settings sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.nav-item{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;border-radius:9px;color:#C4CBC7;font-size:13.5px;font-weight:500;text-decoration:none;border:0;background:transparent;width:100%;box-sizing:border-box;cursor:pointer;font-family:inherit;text-align:left}
.nav-item:hover{background:rgba(255,255,255,0.05)}
.nav-on{background:rgba(70,235,120,0.13);color:#F2F5F3}
.grp{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7E8883;padding:9px 10px 3px}
</style>
</helmet>
<nav aria-label="Settings sections" style="width: 272px; height: 800px; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; background: #0D1012; border-right: 1px solid rgba(255,255,255,0.06); font-family: Manrope, system-ui, sans-serif; color: #EEF3F0; overflow-y: auto">
  <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07)">
    <svg width="52" height="58" viewBox="0 -14 100 114" aria-hidden="true" style="filter: drop-shadow(0 0 8px rgba(70,235,120,0.45))"><path d="M50 30C49 22 50 16 52 10" stroke="#3E7A2E" stroke-width="3" stroke-linecap="round" fill="none"></path><path d="M51 16C42 12 36 14 33 8C42 5 48 9 51 16ZM51 13C59 7 66 8 70 3C64 0 56 3 51 13Z" fill="#5FC46A"></path><rect x="14" y="30" width="72" height="62" rx="28" fill="#E4F6E8"></rect><ellipse cx="38" cy="62" rx="7" ry="4" transform="rotate(-12 38 62)" fill="#1F7A44"></ellipse><ellipse cx="62" cy="62" rx="7" ry="4" transform="rotate(12 62 62)" fill="#1F7A44"></ellipse><ellipse cx="38" cy="61" rx="2" ry="1.3" fill="#C9FFD9"></ellipse><ellipse cx="62" cy="61" rx="2" ry="1.3" fill="#C9FFD9"></ellipse></svg>
    <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
      <div style="font-size: 15px; font-weight: 700">Groovy</div>
      <div style="font-size: 12px; color: #9AA59F">Night · Stage 2</div>
      <div style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden"><div style="width: 58%; height: 5px; background: #46EB78; border-radius: 3px"></div></div>
    </div>
  </div>
  <label style="display: flex; align-items: center; gap: 8px; height: 36px; margin: 12px 0 4px; padding: 0 10px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07); color: #8C9691; font-size: 13px">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <input type="search" placeholder="Search settings" aria-label="Search settings" style="flex-grow: 1; border: 0; outline: 0; background: transparent; color: #EEF3F0; font-family: inherit; font-size: 13px">
    <span style="font-size: 11px; color: #6C7672; border: 1px solid rgba(255,255,255,0.1); border-radius: 5px; padding: 1px 5px">Ctrl K</span>
  </label>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
    <div class="grp">{{g.name}}</div>
    <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
      <button type="button" class="{{it.cls}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg><span style="flex-grow: 1">{{it.label}}</span><sc-if value="{{it.badge}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 700; color: #0D1012; background: #F5B84B; border-radius: 9px; padding: 1px 7px">{{it.badge}}</span></sc-if></button>
    </sc-for>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","character","brains","memory","skills","speaking","listening","dictation","layout","accounts","reminders","browser","permissions","general","system"],"default":"home"},"$preview":{"width":272,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const I = {
      home: 'M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z',
      character: 'M12 3c-3 0-4 2-4 4M6 10h12a3 3 0 013 3v4a4 4 0 01-4 4H7a4 4 0 01-4-4v-4a3 3 0 013-3z',
      brains: 'M9 3a3 3 0 00-3 3 3 3 0 00-2 5 3 3 0 002 5 3 3 0 003 3h1V3zM15 3a3 3 0 013 3 3 3 0 012 5 3 3 0 01-2 5 3 3 0 01-3 3h-1V3z',
      memory: 'M4 6h16v12H4zM8 10h8M8 14h5',
      skills: 'M13 2L4 14h7l-1 8 9-12h-7z',
      speaking: 'M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4',
      listening: 'M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zM5 11a7 7 0 0014 0M12 18v3',
      dictation: 'M4 19h16M6 15l9-9 3 3-9 9H6z',
      layout: 'M3 5h18v6H3zM3 15h8v4H3zM14 15h7v4h-7z',
      accounts: 'M4 6h16v12H4zM4 7l8 6 8-6',
      reminders: 'M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4',
      browser: 'M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',
      permissions: 'M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z',
      general: 'M12 9a3 3 0 100 6 3 3 0 000-6zM19 12l2-1-2-4-2 1-2-2V4h-4v2L9 8 7 7l-2 4 2 1v2l-2 1 2 4 2-1 2 2v2h4v-2l2-2 2 1 2-4-2-1z',
      system: 'M4 4h16v12H4zM8 20h8M12 16v4'
    };
    const mk = (id, label, badge) => ({ id, label, d: I[id], badge: badge || '', cls: 'nav-item' + (id === a ? ' nav-on' : '') });
    return {
      groups: [
        { name: '', items: [mk('home', 'Home')] },
        { name: 'Groovy', items: [mk('character', 'Character & wardrobe')] },
        { name: 'AI', items: [mk('brains', 'Brains'), mk('memory', 'Memory'), mk('skills', 'Skills')] },
        { name: 'Voice', items: [mk('speaking', 'Speaking'), mk('listening', 'Listening & calls'), mk('dictation', 'Dictation')] },
        { name: 'Island', items: [mk('layout', 'Layout & tiles'), mk('accounts', 'Accounts', '1')] },
        { name: 'Everyday', items: [mk('reminders', 'Reminders & breaks')] },
        { name: 'Computer', items: [mk('browser', 'Browser & agents'), mk('permissions', 'Permissions')] },
        { name: 'App', items: [mk('general', 'General'), mk('system', 'System')] }
      ]
    };
  }
}
</script>
</body>
</html>
